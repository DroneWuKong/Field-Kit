name: Windows desktop package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and exercise native executable
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Prismo-Field-Kit-Horizon-windows-x64
          path: |
            build-private/windows/Prismo-Field-Kit-Horizon-0.2.0-windows-x64.zip
            build-private/windows/Prismo-Field-Kit-Horizon-0.2.0-windows-x64.zip.sha256
          if-no-files-found: error
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            build-private/windows/package-test.log
            build-private/windows/work/**/warn-*.txt
            build-private/windows/dist/PrismoFieldKit/WINDOWS_VALIDATION.json
          if-no-files-found: ignore
