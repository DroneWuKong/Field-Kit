name: Field Kit native Android build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform and signing tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test configuration state machines
        run: node --test tests/configuration-model.cjs tests/live-wire.cjs tests/ardu-metadata.cjs
      - name: Install browser checks
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check full-app and connected-device layout
        run: node tests/live-ui.cjs
      - name: Build installable Field Kit APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Stage offline signing tools
        run: |
          mkdir -p app/build/signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" app/build/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" app/build/signing-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: prismo-field-kit-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/signing-tools/apksigner.jar
            app/build/signing-tools/zipalign
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fieldkit-config-ui-${{ github.sha }}
          path: output/ui-preview/
          if-no-files-found: ignore
