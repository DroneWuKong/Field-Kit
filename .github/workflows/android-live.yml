name: Field Kit native Android build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform and signing tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Test configuration state machines
        run: node --test tests/configuration-model.cjs tests/live-wire.cjs
      - name: Build installable configuration preview APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Stage offline signing tools
        run: |
          mkdir -p app/build/signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" app/build/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" app/build/signing-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: fieldkit-config-preview-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/signing-tools/apksigner.jar
            app/build/signing-tools/zipalign
          if-no-files-found: error
