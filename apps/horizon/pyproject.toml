[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radio-horizon-planner"
version = "0.2.0"
description = "Offline terrain and radio analysis for aerial waypoint missions"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.11,<3",
  "numpy>=2,<3", "rasterio>=1.4,<2", "pyproj>=3.7,<4",
  "httpx>=0.27,<1", "python-multipart>=0.0.18", "pillow>=11,<13",
]

[project.scripts]
horizon = "horizon.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pycraf>=2.1,<3"]

[tool.hatch.build.targets.wheel]
packages = ["horizon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
